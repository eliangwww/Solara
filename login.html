<div id="login-container">
    <h2>登录 / 注册</h2>
    <input type="text" id="username" placeholder="用户名" required>
    <input type="password" id="password" placeholder="密码" required>
    
    <input type="text" id="register-code" placeholder="注册码（仅注册需填）">
    
    <button onclick="submitAuth('login')">登 录</button>
    <button onclick="submitAuth('register')">注 册</button>
</div>

<script>
async function submitAuth(action) {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const registerCode = document.getElementById('register-code').value;

    const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, username, password, registerCode })
    });

    const data = await res.json();
    if (res.ok && action === 'login') {
        window.location.href = '/'; // 登录成功，跳转到首页
    } else if (res.ok && action === 'register') {
        alert('注册成功，请点击登录！');
    } else {
        alert(data.error || '发生错误');
    }
}
</script>
